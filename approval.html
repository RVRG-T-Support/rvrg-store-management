<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Material Approval</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===================================== -->
<!-- APH-01B : NAVIGATION -->
<!-- ===================================== -->

<a href="index.html">

Dashboard

</a>

>

Transactions

>

Material Approval

<hr>

<h1>

MATERIAL APPROVAL

</h1>

<hr>

<!-- ===================================== -->
<!-- APH-01C : FILTER -->
<!-- ===================================== -->

<table>

<tr>

<td>

Status

</td>

<td>

<select
id="statusFilter"
onchange="loadPendingRequests()">

<option value="PENDING">

Pending

</option>

<option value="APPROVED">

Approved

</option>

<option value="REJECTED">

Rejected

</option>

</select>

</td>

<td>

Search

</td>

<td>

<input
type="text"
id="searchText"
placeholder="Request / Ticket">

</td>

<td>

<button
onclick="loadPendingRequests()">

Refresh

</button>

</td>

</tr>

</table>

<hr>

<!-- ===================================== -->
<!-- APH-01D : REQUEST LIST -->
<!-- ===================================== -->

<h2>

Pending Requests

</h2>

<table
border="1"
id="approvalTable">

<thead>

<tr>

<th>

Req No

</th>

<th>

Ticket

</th>

<th>

Location

</th>

<th>

Technician

</th>

<th>

Priority

</th>

<th>

Date

</th>

<th>

Status

</th>

<th>

Action

</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

<hr>

<!-- ===================================== -->
<!-- APH-01E : REQUEST DETAILS -->
<!-- ===================================== -->

<h2>

Request Details

</h2>

<table
border="1"
id="detailTable">

<thead>

<tr>

<th>

Material

</th>

<th>

Qty

</th>

<th>

Remarks

</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

<hr>

<!-- ===================================== -->
<!-- APH-01F : ACTION -->
<!-- ===================================== -->

<button
id="approveBtn"
onclick="approveRequest()">

APPROVE

</button>

<button
id="rejectBtn"
onclick="rejectRequest()">

REJECT

</button>

<hr>

<!-- ===================================== -->
<!-- APH-01G : SCRIPT -->
<!-- ===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="approval.js"></script>

</body>

</html>
